<div class="line-section" id="lineActionSection">

  <div class="receive-guide">
    <div class="receive-guide-title">受け取り方</div>

    <ol class="receive-steps">
      <li>「診断コードをコピーする」を押す</li>
      <li>下のボタンでLINEを開く</li>
      <li>トーク画面に貼り付けて送る</li>
    </ol>
  </div>

  <div class="copy-code-box">
    <div class="copy-code-label">LINE送信用の診断コード</div>
    <div class="copy-code-value" id="copyCodeValue">---</div>

    <button
      class="btn-copy-code"
      id="copyCodeBtn"
      type="button"
    >
      診断コードをコピーする
    </button>

    <div
      class="copy-status"
      id="copyStatus"
      role="status"
      aria-live="polite"
    ></div>
  </div>

  <div class="supervisor-proof">
    <img
      src="meta-fv-results/DSC_4920.JPG"
      alt="ビジネス手相診断士 輝路"
      class="supervisor-avatar"
    >

    <div class="supervisor-proof-text">
      <span>手相診断歴13年</span>
      <span>1,250名以上の診断実績</span>
      <span>ビジネス手相診断士 輝路が監修</span>
    </div>
  </div>

  <button
    id="lineBtn"
    class="btn-line"
    type="button"
    data-line-url="https://lin.ee/OINIB8d"
  >
    友だち追加して、診断結果を<br>
    受け取る　▶
  </button>

  <p class="line-note">
    無料・1分で登録できます
  </p>

</div>
