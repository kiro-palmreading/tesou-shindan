<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5QGZDWRNYE"></script>
  <script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>詳しい診断結果｜才能コンパス診断</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap');

    :root {
      --sky: #5ba3d9;
      --sky-light: #a8d4f0;
      --sky-pale: #e8f4fc;
      --sky-bg: #f0f8ff;
      --navy: #1a3a5c;
      --navy-mid: #2a5280;
      --white: #ffffff;
      --text-dark: #1a3a5c;
      --text-mid: #4a6a8a;
      --border: rgba(91, 163, 217, 0.28);
      --shadow: rgba(91, 163, 217, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top left,
          rgba(168, 212, 240, 0.30),
          transparent 34%
        ),
        var(--sky-bg);
      color: var(--text-dark);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 18px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    .page-shell {
      width: min(100%, 640px);
      margin: 0 auto;
      padding: 16px 16px 36px;
    }

    .page-header {
      position: relative;
      overflow: hidden;
      padding: 22px 18px 20px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 4px 24px var(--shadow);
      text-align: center;
    }

    .page-header::after {
      content: '';
      position: absolute;
      right: -42px;
      top: -56px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: var(--sky-pale);
      opacity: 0.75;
      pointer-events: none;
    }

    .page-label {
      position: relative;
      z-index: 1;
      display: inline-block;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--sky-pale);
      color: var(--navy-mid);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .page-title {
      position: relative;
      z-index: 1;
      margin-top: 10px;
      color: var(--navy);
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(24px, 7vw, 31px);
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: 0.04em;
    }

    .diagnosis-code {
      position: relative;
      z-index: 1;
      margin-top: 10px;
      color: var(--text-mid);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    .loading,
    .error-message {
      margin-top: 16px;
      padding: 28px 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--white);
      box-shadow: 0 2px 12px var(--shadow);
      color: var(--text-mid);
      font-size: 16px;
      line-height: 1.9;
      text-align: center;
    }

    .error-message {
      border-left: 4px solid #d96b5b;
      text-align: left;
    }

    .result-content {
      margin-top: 0;
    }

    .result-detail {
      counter-reset: resultStep;
    }

    .result-catch {
      position: relative;
      overflow: hidden;
      padding: 22px 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: linear-gradient(145deg, #ffffff 0%, #f4faff 100%);
      box-shadow: 0 3px 18px var(--shadow);
      text-align: center;
    }

    .result-catch::before,
    .result-catch::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: var(--sky-pale);
      pointer-events: none;
    }

    .result-catch::before {
      width: 88px;
      height: 88px;
      left: -38px;
      bottom: -42px;
    }

    .result-catch::after {
      width: 74px;
      height: 74px;
      right: -34px;
      top: -34px;
    }

    .result-catch p:first-child {
      position: relative;
      z-index: 1;
      color: var(--text-mid);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .result-catch p:last-child {
      position: relative;
      z-index: 1;
      margin-top: 8px;
      color: var(--navy);
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(23px, 6.5vw, 29px);
      font-weight: 700;
      line-height: 1.55;
      letter-spacing: 0.04em;
    }

    .result-block {
      position: relative;
      overflow: hidden;
      margin-top: 16px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--white);
      box-shadow: 0 2px 12px var(--shadow);
    }

    .result-block::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--sky-light), var(--sky));
    }

    .result-block h2,
    .result-block h3 {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 17px;
      padding-bottom: 11px;
      border-bottom: 1px solid var(--border);
      color: var(--navy);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.65;
      text-align: left;
    }

    .result-block h2::before,
    .result-block h3::before {
      counter-increment: resultStep;
      content: counter(resultStep, decimal-leading-zero);
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 36px;
      height: 25px;
      padding: 0 7px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--sky-light), var(--sky));
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    #resultContent .result-block p:not(.highlight-paragraph),
    #resultContent .result-block li {
      text-align: left !important;
    }

    .result-block p {
      margin: 0 0 18px;
      color: var(--text-dark);
      font-size: 17px;
      line-height: 2.02;
      line-break: strict;
      overflow-wrap: break-word;
    }

    .result-block p:last-child {
      margin-bottom: 0;
    }

    .highlight-paragraph {
      margin: 14px 0 20px !important;
      padding: 15px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--sky-pale);
      color: var(--navy) !important;
      font-family: 'Noto Serif JP', serif;
      font-size: 18px !important;
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1.8 !important;
      text-align: center;
    }

    .result-block ul {
      display: grid;
      gap: 10px;
      margin: 15px 0 22px;
      padding: 0;
      list-style: none;
    }

    .result-block li {
      position: relative;
      padding: 13px 14px 13px 45px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #f8fcff;
      color: var(--text-dark);
      font-size: 16px;
      line-height: 1.8;
    }

    .result-block li::before {
      content: '✓';
      position: absolute;
      left: 14px;
      top: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--sky);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
    }

    .result-block strong {
      color: var(--navy);
      font-weight: 700;
    }

    .result-block p.key-message {
      margin: 20px 0 !important;
      padding: 16px 17px;
      border-left: 4px solid var(--sky);
      border-radius: 4px 12px 12px 4px;
      background: linear-gradient(90deg, var(--sky-pale), #f8fcff);
      color: var(--navy);
      font-family: 'Noto Serif JP', serif;
      font-weight: 600;
      line-height: 1.95;
    }

    .result-block p.tip-heading {
      margin: 24px 0 13px !important;
      padding: 13px 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: linear-gradient(135deg, var(--sky-pale), #ffffff);
      color: var(--navy);
      line-height: 1.75;
    }

    .result-block p.quote-line {
      margin: 8px 0 16px;
      padding: 11px 14px;
      border-radius: 10px;
      background: #f8fcff;
      color: var(--navy-mid);
      font-weight: 500;
      text-align: left !important;
    }

    .result-block--final {
      border-color: rgba(91, 163, 217, 0.40);
      background: linear-gradient(160deg, #ffffff 0%, #f3f9fe 100%);
    }

    .result-block--final h2::before,
    .result-block--final h3::before {
      content: '✓';
      min-width: 27px;
      width: 27px;
      padding: 0;
    }

    /* 才能プロファイリング */
    .talent-profile-service {
      border-color: rgba(91, 163, 217, 0.40);
      background: linear-gradient(
        160deg,
        #ffffff 0%,
        #f4faff 100%
      );
    }

    .talent-profile-service .talent-service-lead {
      color: var(--navy);
      font-weight: 700;
    }

    /* レポート見本 */
    .talent-report-sample {
      margin: 8px 0 24px;
      text-align: center;
    }

    .talent-report-sample img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 3px 14px var(--shadow);
    }

    .talent-report-caption {
      margin: 8px 0 0 !important;
      color: var(--text-mid) !important;
      font-size: 12px !important;
      line-height: 1.6 !important;
      text-align: center !important;
    }

    /* お客様の声 */
    .talent-voice {
      margin: 8px 0 24px;
      padding: 18px 17px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #f8fcff;
    }

    .talent-voice-person {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 16px;
    }

    .talent-voice-photo-wrap {
      flex: 0 0 auto;
      text-align: center;
    }

    .talent-voice-photo {
      display: block;
      width: 74px;
      height: 74px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 8px var(--shadow);
    }

    .talent-voice-image-note {
      margin: 5px 0 0 !important;
      color: var(--text-mid) !important;
      font-size: 9px !important;
      line-height: 1.4 !important;
      text-align: center !important;
      white-space: nowrap;
    }

    .talent-voice-person-info {
      min-width: 0;
    }

    .talent-voice-title {
      margin: 0 0 14px !important;
      color: var(--navy) !important;
      font-weight: 700;
      line-height: 1.8 !important;
    }

    .talent-voice-text {
      margin: 0 0 16px !important;
      color: var(--text-dark) !important;
      font-family: 'Noto Serif JP', serif;
      line-height: 2 !important;
    }

    .talent-voice-name {
      margin: 0 0 12px !important;
      color: var(--navy-mid) !important;
      font-size: 14px !important;
      font-weight: 700;
      line-height: 1.7 !important;
    }

    .talent-voice-note {
      margin: 0 !important;
      color: var(--text-mid) !important;
      font-size: 11px !important;
      line-height: 1.6 !important;
    }

    .talent-profile-service .talent-service-button-wrap {
      display: flex;
      justify-content: center;
      margin-top: 24px;
    }

    .talent-profile-service .talent-service-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 360px;
      min-height: 58px;
      padding: 15px 22px;
      border-radius: 10px;
      background: #f28c45;
      color: #ffffff !important;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
      box-shadow: 0 4px 12px rgba(242, 140, 69, 0.20);
      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .talent-profile-service .talent-service-button:hover {
      transform: translateY(-1px);
      opacity: 0.94;
    }

    .talent-profile-service .talent-service-button:active {
      transform: translateY(1px);
    }

    .page-footer {
      padding: 25px 8px 0;
      color: var(--text-mid);
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
    }

    @media (max-width: 420px) {
      .page-shell {
        padding: 12px 12px 28px;
      }

      .result-block {
        padding: 20px 18px;
      }

      .result-block p {
        font-size: 16px;
        line-height: 2;
      }

      .result-block h2,
      .result-block h3 {
        font-size: 17px;
      }

      .talent-profile-service .talent-service-button {
        font-size: 16px;
        padding: 14px 16px;
      }

      .talent-voice {
        padding: 16px 14px;
      }
    }
  </style>
</head>

<body>
  <main class="page-shell">

    <div class="loading" id="loadingMessage">
      診断結果を読み込んでいます...
    </div>

    <div
      class="result-content"
      id="resultContent"
      hidden
    ></div>

    <footer class="page-footer">
      ビジネス手相診断士 輝路（kiro） © 2026
    </footer>

  </main>

  <script>

    const VALID_CODE_PATTERN =
      /^[A-E][1-3](?:X|Y|Z|W|M)$/;

    const resultContent =
      document.getElementById('resultContent');

    const loadingMessage =
      document.getElementById('loadingMessage');

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function getDiagnosisCode() {
      const params =
        new URLSearchParams(window.location.search);

      return String(
        params.get('code') || ''
      )
        .trim()
        .toUpperCase();
    }

    function replaceServiceBlock() {

      /* 旧・手相プロファイリング案内を削除 */
      const oldServiceBlocks =
        resultContent.querySelectorAll(
          '.result-block--service'
        );

      oldServiceBlocks.forEach(function(block) {
        block.remove();
      });

      const resultDetail =
        resultContent.querySelector(
          '.result-detail--visual, .result-detail'
        ) || resultContent;

      const talentBlock =
        document.createElement('article');

      talentBlock.className =
        'result-block talent-profile-service';

      talentBlock.innerHTML = `
        <h2>
          もっと自分自身の強みを深く知りたい方へ
        </h2>

        <p class="talent-service-lead">
          今回の才能コンパス診断では、
          知能線と手の形から、あなたの強みの傾向を読み解きました。
        </p>

        <p>
          ですが、実際の手には、
          一人ひとり異なる特徴が、
          もっとたくさん表れています。
        </p>

        <p>
          才能プロファイリングでは、
          左手と右手の両方を詳しく見ながら、
          あなた自身が持っている強みを、
          さらに深く読み解いていきます。
        </p>

        <p>
          左手からは、生まれ持った強み。
        </p>

        <p>
          右手からは、
          今、表に出ている強みや、
          これまでの経験や努力によって
          育ててきた強み。
        </p>

        <p>
          さらに、
          左手には表れているのに、
          右手ではまだ十分に表れていない特徴があれば、
          「まだ発揮できていない強み」として
          読み解いていきます。
        </p>

        <p>
          見るのは、
          手相の線だけではありません。
        </p>

        <p>
          手の厚み、指の長さ、爪の形なども含めて、
          いくつもの特徴を組み合わせながら、
          あなた個人の強みを詳しく見ていきます。
        </p>

        <p>
          診断結果は、
          A4・3枚の
          「才能プロファイリングレポート」として
          PDFでお届けします。
        </p>

        <div class="talent-report-sample">
          <img
            src="https://cdn.peraichi.com/userData/d6621e34-3268-445c-bb20-ddb971833921/img/4953820c-ae28-416c-b158-48199abfae76/______.png"
            alt="才能プロファイリングレポート見本"
            loading="lazy"
          >
          <p class="talent-report-caption">
            ※実際にお届けするレポートの一例です
          </p>
        </div>

        <div class="talent-voice">

          <p class="talent-voice-title">
            すでにこの才能プロファイリングを受けられた方から、こんなお声をいただいています
          </p>

          <p class="talent-voice-text">
            ❝自分が考えていた強みと、いただいた強みでは大きく違っていました。<br>

            詳細なレポートを書いてくれたことも印象的でした。<br><br>

            強みを発見することをテーマとした書籍も多いですが、ここまで詳細に自分の強みを掘り下げるのは難しいと思います。❞
          </p>

          <div class="talent-voice-person">
            <div class="talent-voice-photo-wrap">
              <img
                class="talent-voice-photo"
                src="https://cdn.peraichi.com/userData/d6621e34-3268-445c-bb20-ddb971833921/img/e9a9d18c-5afc-4d1b-9760-ce31c437cf49/30471427_m.jpg"
                alt="お客様の声 イメージ"
                loading="lazy"
              >
              <p class="talent-voice-image-note">
                ※画像はイメージです
              </p>
            </div>

            <div class="talent-voice-person-info">
              <p class="talent-voice-name">
                会社員・40代男性<br>
                原口様（仮名）
              </p>
            </div>
          </div>

          <p class="talent-voice-note">
            ※個人の感想であり、結果を保証するものではありません。
          </p>

        </div>

        <p>
          「自分には、ほかにどんな強みがあるんだろう？」
        </p>

        <p>
          「まだ気づいていない強みも知ってみたい」
        </p>

        <p>
          そんな方は、
          才能プロファイリングの詳しい内容をご覧ください。
        </p>

        <div class="talent-service-button-wrap">
          <a
            href="https://p6q7m.hp.peraichi.com"
            target="_blank"
            rel="noopener noreferrer"
            class="talent-service-button"
          >
            才能プロファイリングの詳細を見る
          </a>
        </div>
      `;

      resultDetail.appendChild(talentBlock);
    }

    function decorateResult() {

      const paragraphs =
        resultContent.querySelectorAll(
          '.result-block p'
        );

      paragraphs.forEach(function(paragraph) {

        const text =
          paragraph.textContent
            .replace(/\s+/g, ' ')
            .trim();

        const children =
          Array.from(
            paragraph.children
          );

        const hasOnlyStrong =
          children.length === 1 &&
          children[0].tagName === 'STRONG' &&
          paragraph.textContent.trim() ===
            children[0].textContent.trim();

        if (
          hasOnlyStrong &&
          /^[123１２３][．.、]/u.test(text)
        ) {

          paragraph.classList.add(
            'tip-heading'
          );

        } else if (hasOnlyStrong) {

          paragraph.classList.add(
            'key-message'
          );

        } else if (
          /^[「『].+[」』]$/u.test(text) &&
          text.length <= 100
        ) {

          paragraph.classList.add(
            'quote-line'
          );
        }

        if (
          !paragraph.classList.contains(
            'highlight-paragraph'
          )
        ) {

          paragraph.style.setProperty(
            'text-align',
            'left',
            'important'
          );
        }
      });

      resultContent
        .querySelectorAll(
          '.result-block li'
        )
        .forEach(function(item) {

          item.style.setProperty(
            'text-align',
            'left',
            'important'
          );
        });
    }

    function showError(message) {

      loadingMessage.className =
        'error-message';

      loadingMessage.innerHTML =
        message;

      resultContent.hidden =
        true;
    }

    async function loadResult() {

      const code =
        getDiagnosisCode();

      if (
        !VALID_CODE_PATTERN.test(code)
      ) {

        showError(
          '診断結果を表示できませんでした。<br>' +
          'LINEに届いたリンクを、もう一度開いてください。'
        );

        return;
      }

      try {

        const path =
          `line-results/${code}.html`;

        const response =
          await fetch(
            `${path}?v=${Date.now()}`,
            {
              cache: 'no-store'
            }
          );

        if (!response.ok) {
          throw new Error(
            'result not found'
          );
        }

        resultContent.innerHTML =
          await response.text();

        replaceServiceBlock();

        decorateResult();

        const catchTitle =
          resultContent.querySelector(
            '.result-catch p:last-child'
          );

        if (catchTitle) {

          document.title =
            `${catchTitle.textContent.trim()}｜才能コンパス診断`;
        }

        loadingMessage.hidden =
          true;

        resultContent.hidden =
          false;

        if (
          typeof gtag === 'function'
        ) {

          gtag(
            'event',
            'line_result_view',
            {
              diagnosis_code: code
            }
          );
        }

      } catch (error) {

        showError(
          '診断結果を読み込めませんでした。<br>' +
          '<span style="font-size:13px;">' +
          `line-results/${escapeHtml(code)}.html ` +
          'が存在するか確認してください。</span>'
        );
      }
    }

    loadResult();

  </script>
</body>
</html>
