<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5QGZDWRNYE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-5QGZDWRNYE');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>詳しい診断結果｜才能コンパス診断</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap');

    :root {
      --sky: #5ba3d9;
      --sky-light: #a8d4f0;
      --sky-pale: #e8f4fc;
      --sky-bg: #f0f8ff;
      --navy: #1a3a5c;
      --navy-mid: #2a5280;
      --white: #ffffff;
      --text-dark: #1a3a5c;
      --text-mid: #4a6a8a;
      --border: rgba(91, 163, 217, 0.28);
      --shadow: rgba(91, 163, 217, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(168, 212, 240, 0.30), transparent 34%),
        var(--sky-bg);
      color: var(--text-dark);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 18px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    .page-shell {
      width: min(100%, 640px);
      margin: 0 auto;
      padding: 16px 16px 36px;
    }

    .page-header {
      position: relative;
      overflow: hidden;
      padding: 22px 18px 20px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 4px 24px var(--shadow);
      text-align: center;
    }

    .page-header::after {
      content: '';
      position: absolute;
      right: -42px;
      top: -56px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: var(--sky-pale);
      opacity: 0.75;
      pointer-events: none;
    }

    .page-label {
      position: relative;
      z-index: 1;
      display: inline-block;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--sky-pale);
      color: var(--navy-mid);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .page-title {
      position: relative;
      z-index: 1;
      margin-top: 10px;
      color: var(--navy);
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(24px, 7vw, 31px);
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: 0.04em;
    }

    .diagnosis-code {
      position: relative;
      z-index: 1;
      margin-top: 10px;
      color: var(--text-mid);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    .loading,
    .error-message {
      margin-top: 16px;
      padding: 28px 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--white);
      box-shadow: 0 2px 12px var(--shadow);
      color: var(--text-mid);
      font-size: 16px;
      line-height: 1.9;
      text-align: center;
    }

    .error-message {
      border-left: 4px solid #d96b5b;
      text-align: left;
    }

    .result-content {
      margin-top: 16px;
    }

    .result-detail {
      counter-reset: resultStep;
    }

    .result-catch {
      position: relative;
      overflow: hidden;
      padding: 22px 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: linear-gradient(145deg, #ffffff 0%, #f4faff 100%);
      box-shadow: 0 3px 18px var(--shadow);
      text-align: center;
    }

    .result-catch::before,
    .result-catch::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: var(--sky-pale);
      pointer-events: none;
    }

    .result-catch::before {
      width: 88px;
      height: 88px;
      left: -38px;
      bottom: -42px;
    }

    .result-catch::after {
      width: 74px;
      height: 74px;
      right: -34px;
      top: -34px;
    }

    .result-catch p:first-child {
      position: relative;
      z-index: 1;
      color: var(--text-mid);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .result-catch p:last-child {
      position: relative;
      z-index: 1;
      margin-top: 8px;
      color: var(--navy);
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(23px, 6.5vw, 29px);
      font-weight: 700;
      line-height: 1.55;
      letter-spacing: 0.04em;
    }

    .result-block {
      position: relative;
      overflow: hidden;
      margin-top: 16px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--white);
      box-shadow: 0 2px 12px var(--shadow);
    }

    .result-block::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--sky-light), var(--sky));
    }

    .result-block h2,
    .result-block h3 {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 17px;
      padding-bottom: 11px;
      border-bottom: 1px solid var(--border);
      color: var(--navy);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.65;
    }

    .result-block h2::before,
    .result-block h3::before {
      counter-increment: resultStep;
      content: counter(resultStep, decimal-leading-zero);
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 36px;
      height: 25px;
      padding: 0 7px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--sky-light), var(--sky));
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .result-block p {
      margin: 0 0 18px;
      color: var(--text-dark);
      font-size: 17px;
      line-height: 2.02;
      line-break: strict;
      overflow-wrap: break-word;
    }

    .result-block p:last-child {
      margin-bottom: 0;
    }

    .highlight-paragraph {
      margin: 14px 0 20px !important;
      padding: 15px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--sky-pale);
      color: var(--navy) !important;
      font-family: 'Noto Serif JP', serif;
      font-size: 18px !important;
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1.8 !important;
      text-align: center;
    }

    .result-block ul {
      display: grid;
      gap: 10px;
      margin: 15px 0 22px;
      padding: 0;
      list-style: none;
    }

    .result-block li {
      position: relative;
      padding: 13px 14px 13px 45px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #f8fcff;
      color: var(--text-dark);
      font-size: 16px;
      line-height: 1.8;
    }

    .result-block li::before {
      content: '✓';
      position: absolute;
      left: 14px;
      top: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--sky);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
    }

    .result-block strong {
      color: var(--navy);
      font-weight: 700;
    }

    .result-block p.key-message {
      margin: 20px 0 !important;
      padding: 16px 17px;
      border-left: 4px solid var(--sky);
      border-radius: 4px 12px 12px 4px;
      background: linear-gradient(90deg, var(--sky-pale), #f8fcff);
      color: var(--navy);
      font-family: 'Noto Serif JP', serif;
      font-weight: 600;
      line-height: 1.95;
    }

    .result-block p.tip-heading {
      margin: 24px 0 13px !important;
      padding: 13px 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: linear-gradient(135deg, var(--sky-pale), #ffffff);
      color: var(--navy);
      line-height: 1.75;
    }

    .result-block p.quote-line {
      margin: 8px 0 16px;
      padding: 11px 14px;
      border-radius: 10px;
      background: #f8fcff;
      color: var(--navy-mid);
      font-weight: 500;
      text-align: center;
    }

    .result-block--final {
      border-color: rgba(91, 163, 217, 0.40);
      background: linear-gradient(160deg, #ffffff 0%, #f3f9fe 100%);
    }

    .result-block--final h2::before,
    .result-block--final h3::before {
      content: '✓';
      min-width: 27px;
      width: 27px;
      padding: 0;
    }

    .page-footer {
      padding: 25px 8px 0;
      color: var(--text-mid);
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
    }

    @media (max-width: 420px) {
      .page-shell {
        padding: 12px 12px 28px;
      }

      .page-header,
      .result-catch {
        border-radius: 16px;
      }

      .result-block {
        padding: 20px 18px;
      }

      .result-block p {
        font-size: 16px;
        line-height: 2;
      }

      .result-block h2,
      .result-block h3 {
        font-size: 17px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>

<body>
  <main class="page-shell">
    <header class="page-header">
      <div class="page-label">才能コンパス診断</div>
      <h1 class="page-title">あなた専用の詳しい診断結果</h1>
      <div class="diagnosis-code" id="diagnosisCode">診断コードを確認しています</div>
    </header>

    <div class="loading" id="loadingMessage">診断結果を読み込んでいます...</div>
    <div class="result-content" id="resultContent" hidden></div>

    <footer class="page-footer">ビジネス手相診断士 輝路（kiro） © 2026</footer>
  </main>

  <script>
    const VALID_CODE_PATTERN = /^[A-E][1-3](?:X|Y|Z|W|M)$/;

    const resultContent = document.getElementById('resultContent');
    const loadingMessage = document.getElementById('loadingMessage');
    const diagnosisCode = document.getElementById('diagnosisCode');

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function getDiagnosisCode() {
      const params = new URLSearchParams(window.location.search);
      return String(params.get('code') || '').trim().toUpperCase();
    }

    function addVisualClasses() {
      const paragraphs = resultContent.querySelectorAll('.result-block p');

      paragraphs.forEach(function(paragraph) {
        const text = paragraph.textContent.replace(/\s+/g, ' ').trim();
        const children = Array.from(paragraph.children);
        const hasOnlyStrong = children.length === 1
          && children[0].tagName === 'STRONG'
          && paragraph.textContent.trim() === children[0].textContent.trim();

        if (hasOnlyStrong && /^[123１２３][．.、]/u.test(text)) {
          paragraph.classList.add('tip-heading');
          return;
        }

        if (hasOnlyStrong) {
          paragraph.classList.add('key-message');
          return;
        }

        if (/^[「『].+[」』]$/u.test(text) && text.length <= 80) {
          paragraph.classList.add('quote-line');
        }
      });
    }

    function showError(message) {
      loadingMessage.className = 'error-message';
      loadingMessage.innerHTML = message;
      resultContent.hidden = true;
    }

    async function loadResult() {
      const code = getDiagnosisCode();

      if (!VALID_CODE_PATTERN.test(code)) {
        diagnosisCode.textContent = '診断コードが確認できません';
        showError(
          '診断結果を表示できませんでした。<br>' +
          'LINEに届いたリンクを、もう一度開いてください。'
        );
        return;
      }

      diagnosisCode.textContent = `診断コード：${code}`;

      try {
        const path = `line-results/${code}.html`;
        const response = await fetch(`${path}?v=${Date.now()}`, { cache: 'no-store' });

        if (!response.ok) {
          throw new Error('result not found');
        }

        const html = await response.text();
        resultContent.innerHTML = html;
        addVisualClasses();

        const catchTitle = resultContent.querySelector('.result-catch p:last-child');
        if (catchTitle) {
          document.title = `${catchTitle.textContent.trim()}｜才能コンパス診断`;
        }

        loadingMessage.hidden = true;
        resultContent.hidden = false;

        if (typeof gtag === 'function') {
          gtag('event', 'line_result_view', {
            diagnosis_code: code
          });
        }
      } catch (error) {
        showError(
          `診断結果を読み込めませんでした。<br>` +
          `<span style="font-size:13px;">line-results/${escapeHtml(code)}.html が存在するか確認してください。</span>`
        );
      }
    }

    loadResult();
  </script>
</body>
</html>
